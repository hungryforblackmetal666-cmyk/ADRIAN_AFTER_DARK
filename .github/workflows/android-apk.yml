name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip

      - name: Extract Ren'Py project
        run: |
          unzip -q  ADRIAN_AFTER_DARK_v1_0_Visual_Update.zip
          test -f ADRIAN_AFTER_DARK_v1_0/game/script.rpy
          mkdir -p ADRIAN_AFTER_DARK_v1_0/game/characters
          cp game/characters/cast.rpy ADRIAN_AFTER_DARK_v1_0/game/characters/cast.rpy
          mkdir -p ADRIAN_AFTER_DARK_v1_0/game/images/characters
          test -f game/characters/alex_bust.webp
          cp game/characters/alex_bust.webp ADRIAN_AFTER_DARK_v1_0/game/images/characters/alex_bust.webp
          echo "=== GUI.RPY FIRST 100 LINES ==="
          sed -n '1,100p' ADRIAN_AFTER_DARK_v1_0/game/gui.rpy
          echo "=== OPTIONS DISPLAY REFERENCES ==="
          grep -n "screen_width\|screen_height\|fullscreen\|window" ADRIAN_AFTER_DARK_v1_0/game/options.rpy || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ADRIAN_AFTER_DARK_v1_0/game/options.rpy")
          source = p.read_text()
          if "define config.screen_width = 1280" not in source or "define config.screen_height = 720" not in source:
              raise SystemExit("Setările inițiale 1280x720 nu corespund; nu aplicăm modificarea.")
          source = source.replace("define config.screen_width = 1280", "define config.screen_width = 2400", 1)
          source = source.replace("define config.screen_height = 720", "define config.screen_height = 1080", 1)
          p.write_text(source)
          print("Ren'Py virtual resolution set to 2400x1080 (20:9).")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ADRIAN_AFTER_DARK_v1_0/game/screens.rpy")
          s = p.read_text()
          old = "            grid 2 2:"
          new = "            vbox:"
          if old not in s:
              raise SystemExit("Nu am găsit grid-ul orașului așteptat; build oprit pentru siguranță.")
          p.write_text(s.replace(old, new, 1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ADRIAN_AFTER_DARK_v1_0/game")
          script = root / "script.rpy"
          source = script.read_text()
          if "call screen title_gate" not in source:
              source = source.replace("label start:\n", "label start:\n    call screen title_gate\n", 1)
              script.write_text(source)
          screens = root / "screens.rpy"
          source = screens.read_text()
          if "screen title_gate():" not in source:
              gate = '''screen title_gate():
              modal True
              tag menu
              add "bg city"
              add Solid("#080b14aa")
              frame:
                  xalign 0.5
                  yalign 0.5
                  xsize 760
                  background "#0d111be8"
                  padding (44, 36)
                  vbox:
                      xalign 0.5
                      spacing 22
                      text "ADRIAN: AFTER DARK" size 46 color "#d9c4a0" xalign 0.5
                      text "SANDBOX EDITION" size 22 color "#a8c5c8" xalign 0.5
                      null height 12
                      textbutton "NEW GAME" action Return() xalign 0.5
                      textbutton "LOAD GAME" action ShowMenu("load") xalign 0.5
                      textbutton "SETTINGS" action ShowMenu("preferences") xalign 0.5
                      textbutton "QUIT" action Quit(confirm=True) xalign 0.5
          
          '''
              screens.write_text(gate + source)
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ADRIAN_AFTER_DARK_v1_0/game")
          
          art = root / "characters_art.rpy"
          source = art.read_text()
          if 'image alex_bust = "images/characters/alex_bust.webp"' not in source:
              source += '\nimage alex_bust = "images/characters/alex_bust.webp"\n'
              art.write_text(source)
          
          script = root / "script.rpy"
          source = script.read_text()
          cafe = 'label visit_cafe:\n    scene bg cafe\n'
          if cafe not in source:
              raise SystemExit("Nu am găsit scena Café Sable pentru integrarea lui Alex.")
          if 'show alex_bust at character_right' not in source:
              source = source.replace(cafe, cafe + '    show alex_bust at character_right\n', 1)
          if 'hide alex_bust' not in source:
              source = source.replace('    jump city_hub\n\nlabel visit_penthouse:', '    hide alex_bust\n    jump city_hub\n\nlabel visit_penthouse:', 1)
          script.write_text(source)
          
          screens = root / "screens.rpy"
          source = screens.read_text()
          old = '            textbutton "Phone" action Jump("phone_menu")'
          new = old + '\n            textbutton "Skip" action Skip()'
          if 'textbutton "Skip" action Skip()' not in source:
              if old not in source:
                  raise SystemExit("Nu am găsit butonul Phone din quick_menu.")
              source = source.replace(old, new, 1)
          screens.write_text(source)
          with screens.open("a") as f:
              f.write("""
          
          screen dialog_controls_overlay():
              zorder 200
              frame:
                  xalign 0.98
                  yalign 0.98
                  background "#101522dd"
                  padding (12, 8)
                  hbox:
                      spacing 12
                      textbutton "AUTO" action Preference("auto-forward", "toggle")
                      textbutton "HISTORY" action ShowMenu("history")
                      textbutton "SKIP MODE" action Show("skip_mode_settings")

          screen skip_mode_settings():
              modal True
              zorder 300
              frame:
                  xalign 0.5
                  yalign 0.5
                  background "#101522ee"
                  padding (32, 24)
                  vbox:
                      spacing 16
                      text "SKIP SETTINGS" size 32
                      text "Choose what the SKIP button can skip:"
                      textbutton "SEEN DIALOGUE ONLY" action [Preference("skip", "seen"), Hide("skip_mode_settings")]
                      textbutton "ALL DIALOGUE (INCLUDING NEW)" action [Preference("skip", "all"), Hide("skip_mode_settings")]
                      textbutton "CLOSE" action Hide("skip_mode_settings")
          
          init python:
              if "quick_menu" not in config.overlay_screens:
                  config.overlay_screens.append("quick_menu")
              if "dialog_controls_overlay" not in config.overlay_screens:
                  config.overlay_screens.append("dialog_controls_overlay")
          """)
          PY

      - name: Download Ren'Py SDK and RAPT
        run: |
          curl -fL --retry 3 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 -o /tmp/renpy-sdk.tar.bz2
          mkdir -p /tmp/renpy-sdk
          tar -xjf /tmp/renpy-sdk.tar.bz2 -C /tmp/renpy-sdk
          SDK_DIR="$(find /tmp/renpy-sdk -maxdepth 2 -type f -name renpy.sh -printf '%h\n' | head -n 1)"
          test -n "$SDK_DIR"
          chmod +x "$SDK_DIR/renpy.sh"
          curl -fL --retry 3 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-rapt.zip -o /tmp/rapt.zip
          unzip -q /tmp/rapt.zip -d "$SDK_DIR"
          test -d "$SDK_DIR/rapt"
          echo "RENPY_SDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "RAPT_DIR=$SDK_DIR/rapt" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        env:
          RAPT_NO_TERMS: '1'
        run: |
          mkdir -p "$RAPT_DIR/Sdk"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cmdline-tools.zip
          mkdir -p "$RAPT_DIR/Sdk/cmdline-tools"
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$RAPT_DIR/Sdk/cmdline-tools/latest"
          yes | "$RAPT_DIR/Sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RAPT_DIR/Sdk" --licenses
          "$RAPT_DIR/Sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RAPT_DIR/Sdk" "platform-tools" "platforms;android-36"
          echo "$RAPT_DIR/Sdk" > "$RAPT_DIR/sdk.txt"
          echo "ANDROID_HOME=$RAPT_DIR/Sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RAPT_DIR/Sdk" >> "$GITHUB_ENV"

      - name: Configure package and temporary test signing key
        run: |
          cd ADRIAN_AFTER_DARK_v1_0
          cat > android.json <<'JSON'
          {
            "package": "com.afterdark.adrian",
            "name": "ADRIAN: AFTER DARK",
            "icon_name": "ADRIAN AFTER DARK",
            "version": "1.0",
            "numeric_version": 1,
            "orientation": "sensorLandscape",
            "permissions": ["INTERNET", "VIBRATE"],
            "include_pil": false,
            "include_sqlite": false,
            "layout": null,
            "source": false,
            "expansion": false,
            "google_play_key": null,
            "google_play_salt": null,
            "store": "none",
            "update_icons": true,
            "update_always": true,
            "heap_size": "4",
            "update_keystores": true
          }
          JSON
          keytool -genkeypair -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -keypass android -storepass android -dname "CN=ADRIAN AFTER DARK Test Build" -validity 20000
          cp android.keystore bundle.keystore

      - name: Compile universal Android APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RAPT_DIR"])
          manifests = list(root.rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("Nu am găsit șablonul AndroidManifest.xml în RAPT.")
          changed = 0
          for p in manifests:
              source = p.read_text(errors="ignore")
              if "<activity" not in source:
                  continue
              updated = source
              # Let Android resize the game activity to the full ultrawide display.
              updated = updated.replace("<activity", '<activity android:resizeableActivity="true" android:maxAspectRatio="2.4"', 1)
              if updated != source:
                  p.write_text(updated)
                  changed += 1
                  print("Patched Android aspect-ratio manifest:", p)
          if changed == 0:
              raise SystemExit("Nu am putut aplica setările de aspect ratio în manifestul RAPT.")
          PY
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cd "$RENPY_SDK"
          ./renpy.sh launcher android_build "$GITHUB_WORKSPACE/ADRIAN_AFTER_DARK_v1_0" --destination "$GITHUB_WORKSPACE/apk-output"

      - name: Verify APK output
        run: |
          find apk-output -type f -name '*.apk' -print -quit | grep -q .
          find apk-output -type f -name '*.apk' -printf '%p (%s bytes)\n'

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: adrian-after-dark-android-test-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
